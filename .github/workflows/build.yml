name: Build DocuBuds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: docubuds-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK built by the build job
        uses: actions/download-artifact@v4
        with:
          name: docubuds-debug-apk
          path: apk

      - name: Rename APK
        run: cp apk/app-debug.apk docubuds-v1.0.0.apk

      - name: Create GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: docubuds-v1.0.0.apk
          name: DocuBuds v1.0.0
          body: |
            DocuBuds v1.0.0 — complete Android vault app.
            Free, fully offline, no ads. See README.md for what was tested.
            Install the APK directly on your Android phone (allow installing from this source when asked).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
