name: Build DocuBuds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # android-actions/setup-android@v3 fails on current runners:
        # it asks sdkmanager to install the removed 'tools' package.
        # The runner already has an SDK; just install what the build needs.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check keystore secret lengths
        run: |
          echo "A: $(printf '%s' "${{ secrets.KEYSTORE_B64_A }}" | wc -c) (expect 895)"
          echo "B: $(printf '%s' "${{ secrets.KEYSTORE_B64_B }}" | wc -c) (expect 895)"
          echo "C: $(printf '%s' "${{ secrets.KEYSTORE_B64_C }}" | wc -c) (expect 895)"
          echo "D: $(printf '%s' "${{ secrets.KEYSTORE_B64_D }}" | wc -c) (expect 895)"

      - name: Decode release keystore
        run: printf '%s%s%s%s' "${{ secrets.KEYSTORE_B64_A }}" "${{ secrets.KEYSTORE_B64_B }}" "${{ secrets.KEYSTORE_B64_C }}" "${{ secrets.KEYSTORE_B64_D }}" | tr -d '[:space:]' | base64 -d > $RUNNER_TEMP/docubuds-release.jks

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/docubuds-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: docubuds-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK built by the build job
        uses: actions/download-artifact@v4
        with:
          name: docubuds-release-apk
          path: apk

      - name: Rename APK
        run: cp apk/app-release.apk docubuds-v1.0.0.apk

      - name: Create GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: docubuds-v1.0.0.apk
          name: DocuBuds v1.0.0
          body: |
            DocuBuds v1.0.0 — final release build of the complete Android vault app.
            Free, fully offline, no ads. See README.md for what was tested.
            Install the APK directly on your Android phone (allow installing from this source when asked).
            If you installed the earlier debug build, uninstall it first — the release build is signed with a different key.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
